<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Generator Prototype</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #output { margin-top: 20px; padding: 15px; border: 1px solid #ccc; background: #f9f9f9; white-space: pre-wrap; }
        .metadata { font-size: 0.85em; color: #555; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px;}
    </style>
</head>
<body>

    <h2>Modular Content Generator (Test)</h2>
    <p>Click the button to combine a random niche with a random format and generate a post.</p>
    
    <button id="generateBtn">Generate Test Post</button>
    <div id="output">Output will appear here...</div>

    <script>
        // 1. Insert your actual OpenAI API key here for local testing ONLY.
        // NEVER upload this file to GitHub Pages with the key still in it.
        const OPENAI_API_KEY = 'sk-YOUR-API-KEY-HERE';

        // 2. The Modular Arrays
        const niches = [
            "Seniors with pre-existing conditions (diabetes, heart issues) who think they can't get approved for life insurance.",
            "Seniors living strictly on fixed Social Security incomes who think burial insurance is too expensive.",
            "Proud grandparents who want to leave a small $5,000 to $10,000 legacy gift behind for a grandchild."
        ];

        const formats = [
            "Write a 3-sentence myth-busting text post. Keep it punchy and direct.",
            "Write a 45-second spoken video script. Format as a two-column markdown table (Visual / Audio).",
            "Write a short, compassionate 4-sentence story about a family who was protected."
        ];

        document.getElementById('generateBtn').addEventListener('click', async () => {
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = "Generating... (This takes a few seconds)";

            // 3. Randomly select one niche and one format
            const randomNiche = niches[Math.floor(Math.random() * niches.length)];
            const randomFormat = formats[Math.floor(Math.random() * formats.length)];

            // 4. Build the Master Prompt
            const systemPrompt = `
                You are a respectful, plain-spoken life insurance agent. 
                Your target audience: ${randomNiche}
                
                [STRICT CONSTRAINTS]
                - Use a 5th-grade reading level. Tone must be dignified and clear.
                - DO NOT use the words: crucial, navigate, peace of mind, or wealth.
                - Say "monthly bill" instead of "premium," and "payout" instead of "death benefit."
                
                [TASK]
                ${randomFormat}
            `;

            try {
                // 5. Call the OpenAI API
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${OPENAI_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini", // Using the faster, cheaper model for testing
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: "Generate the post based on your system instructions." }
                        ],
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                
                // 6. Display the result on the screen
                const generatedContent = data.choices[0].message.content;
                outputDiv.innerHTML = `
                    <div class="metadata">
                        <strong>Selected Niche:</strong> ${randomNiche}<br>
                        <strong>Selected Format:</strong> ${randomFormat}
                    </div>
                    <div>${generatedContent}</div>
                `;

            } catch (error) {
                outputDiv.innerHTML = `<span style="color:red">Error: ${error.message}. Did you paste your API key?</span>`;
            }
        });
    </script>
</body>
</html>
